# 提交前自动检查：pip install -r requirements-dev.txt && pre-commit install
# 目标是把“格式/导入顺序/明显错误”挡在提交之前，而不是靠人工 review 发现。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^python/fastapi-demo/
      - id: ruff-format
        files: ^python/fastapi-demo/
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key  # 防止 .env、密钥被误提交
