name: CI

# 只在改动到该项目时触发，避免 monorepo 里其他目录的提交也跑一遍
on:
  push:
    branches: [main]
    paths:
      - "python/fastapi-demo/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "python/fastapi-demo/**"
      - ".github/workflows/ci.yml"

jobs:
  fastapi-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python/fastapi-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/fastapi-demo/requirements*.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 静态检查
        run: |
          ruff check .
          ruff format --check .

      # 测试用占位 DATABASE_URL，不连接 MySQL，因此不需要 service 容器
      - name: 运行测试
        run: pytest -q
