# 单一依赖来源：运行时依赖在 [project.dependencies]，开发工具在 [dependency-groups]。
# 版本锁定由 uv.lock 负责（`uv lock` 生成、`uv sync --frozen` 安装），不要再手写 requirements.txt。
# 工具说明：ruff 同时负责 lint 与格式化，pytest 负责测试，pre-commit 负责提交前检查。

[project]
name = "fastapi-demo"
version = "0.1.0"
description = "FastAPI + SQLAlchemy 商品管理示例后端（学习项目）"
# 应用代码 3.10 即可运行（ruff target 仍是 py310），但 dev 组的 pre-commit 4.x 要求 >=3.11，
# 统一取 3.11 以免 uv 为 3.10 解析出一套装不上的依赖
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]==0.124.4",
    "SQLAlchemy==2.0.44",          # 用 ORM 描述表并操作数据库
    "PyMySQL[rsa]==1.1.2",         # MySQL 驱动；[rsa] 提供认证所需额外依赖
    "alembic==1.20.1",             # 迁移：生成版本化脚本、按版本升级/回滚
    "pydantic-settings==2.12.0",   # 读环境变量与 .env
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pytest==9.2.0",
    "pre-commit==4.7.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
# 这不是要发布成包的应用，uv 只需同步依赖，不要尝试构建/安装本项目
package = false

[tool.ruff]
# 与 fastapi 0.124 / SQLAlchemy 2.0 支持的 Python 版本对齐：代码用到 X | None 语法，最低 3.10
target-version = "py310"
line-length = 100
extend-exclude = [".venv", "__pycache__", "docs"]

[tool.ruff.lint]
# 规则集选择原则：只启用“发现真实缺陷”和“统一风格”的规则，避免把中文注释也当成错误
select = [
    "E4", "E7", "E9",  # pycodestyle 的 import/语法类错误
    "F",               # pyflakes：未定义名字、未使用变量与导入
    "W",               # pycodestyle 空白问题
    "I",               # isort：导入分组与排序
    "UP",              # pyupgrade：过时的写法
    "B",               # bugbear：容易引入 bug 的写法
    "SIM",             # 可简化写法
    "C4",              # comprehensions
    "RET",             # return 语句风格
    "PTH",             # pathlib 替代 os.path
    "ARG",             # 未使用的函数参数
    "DTZ",             # 不带时区的时间处理
    "G", "LOG",        # 日志调用规范
    "RUF100",          # 失效的 noqa
]
ignore = [
    "E501",   # 行宽交给 ruff format 处理，中文注释按语义换行
    "SIM102", # 嵌套 if 在这里表达“先判断字段是否提交、再判断取值是否合法”两步语义
]

[tool.ruff.lint.per-file-ignores]
# Starlette 要求异常处理器签名固定为 (request, exc)，request 未使用也必须保留
"app/common/exceptions.py" = ["ARG001"]
# 测试里构造“无时区的 datetime”是为了对齐接口输出的时间格式，属于有意为之
"tests/*" = ["DTZ001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 让 tests/ 里可以直接 from app... 导入，无需安装成包
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80 -q"

[tool.coverage.run]
source = ["app"]
# 两个脚本只有 __main__ 入口，靠手工执行，测试覆盖不到也不该算进来
omit = ["app/init_db.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# 商品/分类模块归档后分母变小、对话链路覆盖充分，实测见 CI 日志；门槛仍是 80
fail_under = 80
