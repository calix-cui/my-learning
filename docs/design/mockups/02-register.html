<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>My Agent · 注册</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <div class="brand__mark">AI</div>
        <div class="brand__name">My Agent</div>
      </div>
      <h1 class="auth__title">注册</h1>
      <p class="auth__desc">一个邮箱对应一个人，你的对话不会出现在别人那里。</p>

      <form>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" class="input" type="email" placeholder="you@example.com" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" class="input is-focus" type="password" placeholder="至少 8 位" />
          <p class="hint">8–72 位，不强制大小写或符号组合。</p>
        </div>
        <div class="field">
          <label for="display">显示名（可选）</label>
          <input id="display" class="input" type="text" placeholder="别人看到的名字，暂时只有你自己" />
        </div>
        <button class="btn btn-primary btn-lg" type="button">创建账号</button>
      </form>

      <p class="auth__foot">已有账号？<a href="#">去登录</a></p>
    </div>
  </div>
</body>
</html>
