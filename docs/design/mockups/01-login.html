<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>My Agent · 登录</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="auth">
    <div class="auth__card">
      <div class="auth__brand">
        <div class="brand__mark">AI</div>
        <div class="brand__name">My Agent</div>
      </div>
      <h1 class="auth__title">登录</h1>
      <p class="auth__desc">登录后即可与你的助手对话，历史会话只属于你。</p>

      <form>
        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" class="input" type="email" value="you@example.com" />
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input id="password" class="input is-focus" type="password" value="password123" />
        </div>
        <button class="btn btn-primary btn-lg" type="button">登录</button>
      </form>

      <p class="auth__foot">还没有账号？<a href="#">注册一个</a></p>
    </div>
  </div>
</body>
</html>
