<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>My Agent · 设置 · 模型接入</title>
<link rel="stylesheet" href="./app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark">AI</div>
        <div class="brand__name">My Agent</div>
      </div>
      <div class="sidebar__body">
        <div class="sidebar__label">会话</div>
        <button class="thread">
          <div class="thread__title">给可乐设计三档定价</div>
          <div class="thread__meta">4 条 · 11-09 21:20</div>
        </button>
        <button class="thread">
          <div class="thread__title">FastAPI 的依赖注入怎么讲清楚</div>
          <div class="thread__meta">2 条 · 11-09 18:04</div>
        </button>
      </div>
      <div class="sidebar__footer">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="avatar">李</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;color:var(--ink)">李维</div>
            <div style="font-size:12px;overflow:hidden;text-overflow:ellipsis">liwei@example.com</div>
          </div>
          <button class="btn-ghost btn" style="height:30px;padding:0 8px;color:var(--pine);font-weight:600">设置</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div class="topbar__crumbs">设置 <span style="color:var(--ink-faint)">/</span> <b>模型接入</b></div>
        <div class="topbar__user"><span class="dot-online"></span> 已连接</div>
      </div>

      <div class="settings">
        <nav class="settings__nav">
          <button class="settings__item is-active">模型接入</button>
          <button class="settings__item">账号资料</button>
          <button class="settings__item">登录设备</button>
          <button class="settings__item">外观</button>
          <button class="settings__item">数据管理</button>
          <button class="settings__item">概览</button>
        </nav>

        <div class="settings__panel">
          <div class="settings__col">
            <div class="settings__h1">模型接入</div>
            <div class="settings__note">支持任何 OpenAI 兼容服务。Key 只在你自己的库里，界面只显示末四位。</div>

            <div class="section">
              <div class="field">
                <label>服务类型</label>
                <div class="segmented">
                  <span class="is-on">OpenAI 兼容</span>
                  <span>内置演示（fake）</span>
                </div>
              </div>

              <div class="field">
                <label for="base">Base URL</label>
                <input id="base" class="input" value="https://api.deepseek.com/v1" />
                <p class="hint">末尾带 <code>/v1</code>；请求会打到 <code>{base}/chat/completions</code>。</p>
              </div>

              <div class="field">
                <label for="key">API Key</label>
                <div style="display:flex;gap:8px">
                  <input id="key" class="input" style="flex:1" value="••••••••••••••••••••3f9c" />
                  <button class="btn btn-secondary">更换</button>
                </div>
                <p class="hint">保存后不可再查看全文；忘记就只能重新填一个。</p>
              </div>

              <div class="field">
                <label for="model">模型名</label>
                <input id="model" class="input" value="deepseek-chat" />
              </div>

              <div class="field" style="margin-bottom:0">
                <label for="timeout">超时（秒）</label>
                <input id="timeout" class="input" style="width:140px" value="60" />
                <p class="hint">本地大模型建议 120 以上；超过这个时间会返回 504。</p>
              </div>
            </div>

            <div class="row" style="margin-top:8px">
              <div class="toast" style="flex:1;margin-right:12px">
                上次测试：0.92s 返回，模型回报 deepseek-flash（已可用）
              </div>
              <button class="btn btn-secondary" style="height:36px;font-size:13px">测试连接</button>
              <button class="btn btn-primary" style="height:36px;font-size:13px">保存</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
