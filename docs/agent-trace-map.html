<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 全链路 · 断点地图</title>
<style>
  :root{
    --paper:#f6f4ef; --ink:#1d1c19; --muted:#6f6b63; --line:#d9d4c9;
    --card:#fffdf9; --border:rgba(29,28,25,.10);
    --entry:#2f6b5e; --ctx:#3c5a86; --llm:#8a5a2b; --tool:#9a3f3f;
    --skill:#6b4c86; --resume:#5d6b32; --state:#575450;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:18px; padding:18px 24px 14px;
    border-bottom:1px solid var(--line); background:rgba(246,244,239,.92);
    position:sticky; top:0; z-index:20; backdrop-filter:blur(8px);
  }
  .brand{display:flex; flex-direction:column; gap:2px; min-width:0}
  h1{
    margin:0; font:600 19px/1.2 "Songti SC",Georgia,"Times New Roman",serif;
    letter-spacing:.01em; white-space:nowrap;
  }
  .sub{color:var(--muted); font-size:11.5px; letter-spacing:.02em; white-space:nowrap}
  .sub code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px}
  .tools{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .search{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--border); border-radius:8px; padding:0 10px; height:32px;
  }
  .search input{
    border:0; outline:0; background:transparent; width:190px; font:inherit; color:inherit;
  }
  .search input::placeholder{color:#a29d94}
  button{
    font:inherit; font-size:12px; color:var(--ink); background:var(--card);
    border:1px solid var(--border); border-radius:8px; height:32px; padding:0 11px;
    cursor:pointer; transition:background .15s,border-color .15s;
  }
  button:hover{background:#fff; border-color:rgba(29,28,25,.22)}
  button:active{transform:translateY(1px)}

  main{display:flex; height:calc(100% - 69px); align-items:stretch}
  #canvas{position:relative; flex:1; overflow:auto; min-width:0}
  #world{position:relative; transform-origin:0 0}
  #wires{position:absolute; inset:0; overflow:visible; pointer-events:none}
  #wires path{fill:none; stroke:#cfc9bd; stroke-width:1.2}
  #wires path.hot{stroke:#9d9484}

  .node{
    position:absolute; width:236px; height:44px; background:var(--card);
    border:1px solid var(--border); border-left:2px solid var(--ac,var(--state));
    border-radius:9px; padding:6px 26px 6px 10px; cursor:pointer;
    box-shadow:0 1px 2px rgba(29,28,25,.04);
    transition:box-shadow .15s, border-color .15s, transform .15s;
    display:flex; flex-direction:column; justify-content:center; gap:1px;
  }
  .node:hover{box-shadow:0 3px 10px rgba(29,28,25,.09); transform:translateY(-1px)}
  .node.sel{border-color:var(--ac,var(--state)); box-shadow:0 0 0 3px color-mix(in srgb, var(--ac,var(--state)) 16%, transparent)}
  .node.dim{opacity:.38}
  .node.hit{background:#fff8e8; border-color:#c9a24a}
  .node .t{font-weight:600; font-size:12.5px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .node .s{font:11px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .node.root{width:168px; height:54px; border-left-width:3px}
  .node.root .t{font-size:13.5px}
  .toggle{
    position:absolute; right:-8px; top:50%; transform:translateY(-50%);
    width:16px; height:16px; border-radius:50%; background:var(--paper);
    border:1px solid var(--line); color:var(--muted); display:grid; place-items:center;
    font:10px/1 ui-monospace,monospace; z-index:3;
  }
  .node:hover .toggle{background:#fff; color:var(--ink)}
  .b-entry{--ac:var(--entry)} .b-ctx{--ac:var(--ctx)} .b-llm{--ac:var(--llm)}
  .b-tool{--ac:var(--tool)} .b-skill{--ac:var(--skill)} .b-resume{--ac:var(--resume)}
  .b-state{--ac:var(--state)} .b-root{--ac:#1d1c19}

  aside{
    width:400px; flex:0 0 400px; border-left:1px solid var(--line);
    background:#fbf9f5; overflow:auto; padding:22px 22px 40px;
  }
  .empty{color:var(--muted); margin-top:40px; text-align:center; font-size:12.5px; line-height:1.9}
  .chip{
    display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px;
    border-radius:5px; font-size:11px; letter-spacing:.02em; color:#fff; background:var(--ac,var(--state));
  }
  aside h2{margin:12px 0 4px; font:600 17px/1.35 "Songti SC",Georgia,serif}
  .path{
    display:flex; align-items:center; gap:6px; margin:2px 0 14px;
    font:11.5px/1.5 ui-monospace,Menlo,monospace; color:var(--muted); word-break:break-all;
  }
  .path button{height:22px; padding:0 7px; font-size:10.5px; flex:0 0 auto}
  aside p.desc{margin:0 0 16px; color:#3b3833; font-size:12.5px}
  .sec{margin:0 0 15px}
  .sec h3{
    margin:0 0 6px; font-size:10.5px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; color:var(--muted);
  }
  .bp{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}
  .bp li{
    display:flex; gap:8px; align-items:baseline; background:var(--card);
    border:1px solid var(--border); border-radius:6px; padding:6px 8px;
    font:11.5px/1.5 ui-monospace,Menlo,monospace;
  }
  .bp b{color:var(--ac,var(--state)); font-weight:600; flex:0 0 auto}
  .bp span{color:#4b4740; font-family:-apple-system,"PingFang SC",sans-serif; font-size:12px}
  ul.watch{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:5px}
  ul.watch li{
    font:11px/1.4 ui-monospace,Menlo,monospace; color:#3b3833;
    background:#eee9df; border-radius:4px; padding:3px 7px;
  }
  .trace{
    display:inline-block; font:11px/1.5 ui-monospace,Menlo,monospace;
    background:#1d1c19; color:#e9e4d9; border-radius:4px; padding:3px 7px;
  }
  .rel{display:flex; flex-direction:column; gap:4px; font-size:12px}
  .rel button{
    text-align:left; height:auto; padding:5px 8px; font-size:12px; line-height:1.4;
    display:flex; gap:8px; align-items:baseline;
  }
  .rel button i{font:10px ui-monospace,monospace; color:var(--muted); font-style:normal}
  .hint{color:var(--muted); font-size:11px; margin-top:18px; border-top:1px solid var(--line); padding-top:10px; line-height:1.6}

  @media (max-width:900px){
    main{flex-direction:column; height:auto}
    aside{width:auto; flex:auto; border-left:0; border-top:1px solid var(--line)}
    #canvas{height:60vh}
    header{flex-wrap:wrap}
    .tools{margin-left:0; width:100%}
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Agent 全链路 · 断点地图</h1>
    <div class="sub">My Agent &nbsp;·&nbsp; <code>codex/skill-tool-system @ 13b5701</code></div>
  </div>
  <div class="tools">
    <label class="search">
      <span style="color:#a29d94">⌕</span>
      <input id="q" type="search" placeholder="搜环节 / 文件 / 事件，如 policy、skill、" autocomplete="off">
    </label>
    <button id="expand">展开全部</button>
    <button id="collapse">收起分支</button>
    <button id="fit">适配宽度</button>
  </div>
</header>

<main>
  <div id="canvas">
    <div id="world">
      <svg id="wires"></svg>
      <div id="nodes"></div>
    </div>
  </div>
  <aside id="panel">
    <div class="empty">
      点击左侧任意节点<br>
      查看断点行号、观察变量与对应 trace 事件
    </div>
  </aside>
</main>

const NODE_H = 44, ROW = 52, COL = 268, PAD = 28;
const byId = new Map();
const parentOf = new Map();
const nodesEl = document.getElementById('nodes');
const wires = document.getElementById('wires');
const world = document.getElementById('world');
const canvas = document.getElementById('canvas');
const panel = document.getElementById('panel');
const collapsed = new Set();
let selected = null;

function walk(n, fn, parent){
  byId.set(n.id, n); if(parent) parentOf.set(n.id, parent);
  fn(n);
  (n.c || []).forEach(k => walk(k, fn, n));
}
walk(TREE, () => {});

function render(){
  nodesEl.innerHTML = '';
  let leaf = 0;
  const visible = [];

  function place(n, depth){
    n._x = PAD + depth * COL;
    const kids = n.c || [];
    if(!kids.length || collapsed.has(n.id)){
      n._y = PAD + leaf * ROW; leaf++;
    } else {
      kids.forEach(k => place(k, depth + 1));
      n._y = (kids[0]._y + kids[kids.length - 1]._y) / 2;
    }
    visible.push(n);
  }
  place(TREE, 0);

  let maxX = 0, maxY = 0;
  visible.forEach(n => {
    maxX = Math.max(maxX, n._x + 240);
    maxY = Math.max(maxY, n._y + NODE_H + PAD);
    const el = document.createElement('div');
    el.className = 'node b-' + n.br + (n.id === 'root' ? ' root' : '') + (selected === n.id ? ' sel' : '');
    el.style.left = n._x + 'px';
    el.style.top = n._y + 'px';
    el.dataset.id = n.id;
    el.innerHTML = '<div class="t"></div><div class="s"></div>';
    el.querySelector('.t').textContent = n.t;
    el.querySelector('.s').textContent = n.s;
    el.addEventListener('click', e => {
      if(e.target.classList.contains('toggle')) return;
      if(n.c && n.c.length && collapsed.has(n.id)){ collapsed.delete(n.id); render(); }
      select(n.id);
    });
    if(n.c && n.c.length){
      const t = document.createElement('span');
      t.className = 'toggle';
      t.textContent = collapsed.has(n.id) ? '+' : '−';
      t.title = collapsed.has(n.id) ? '展开' : '收起';
      t.addEventListener('click', e => {
        e.stopPropagation();
        collapsed.has(n.id) ? collapsed.delete(n.id) : collapsed.add(n.id);
        render();
      });
      el.appendChild(t);
    }
    nodesEl.appendChild(el);
  });

  const paths = [];
  visible.forEach(n => {
    if(!n.c || collapsed.has(n.id)) return;
    n.c.forEach(k => {
      const x1 = n._x + 240, y1 = n._y + NODE_H / 2;
      const x2 = k._x, y2 = k._y + NODE_H / 2;
      const mid = (x1 + x2) / 2;
      paths.push('<path d="M' + x1 + ' ' + y1 + ' C' + mid + ' ' + y1 + ' ' + mid + ' ' + y2 + ' ' + x2 + ' ' + y2 + '"/>');
    });
  });
  wires.setAttribute('width', maxX);
  wires.setAttribute('height', maxY);
  wires.innerHTML = paths.join('');
  world.style.width = maxX + 'px';
  world.style.height = maxY + 'px';
}

function expandTo(id){
  let p = parentOf.get(id);
  while(p){ collapsed.delete(p.id); p = parentOf.get(p.id); }
}

function select(id){
  selected = id;
  const n = byId.get(id);
  document.querySelectorAll('.node').forEach(el => el.classList.toggle('sel', el.dataset.id === id));
  renderPanel(n);
}

function renderPanel(n){
  const br = BR[n.br] || BR.state;
  const kids = n.c || [];
  const par = parentOf.get(n.id);
  const bp = n.bp || [[n.l, '入口 / 关键行']];
  panel.innerHTML =
    '<span class="chip" style="--ac:var(--' + n.br + ')">' + br.n + '</span>' +
    '<h2></h2>' +
    '<div class="path"><span class="p"></span><button id="copy">复制</button></div>' +
    '<p class="desc"></p>' +
    '<div class="sec"><h3>断点</h3><ul class="bp"></ul></div>' +
    (n.e ? '<div class="sec"><h3>对应 trace 事件</h3><span class="trace"></span></div>' : '') +
    (n.w && n.w.length ? '<div class="sec"><h3>观察这些值</h3><ul class="watch"></ul></div>' : '') +
    (n.d2 ? '<div class="sec"><h3>备注</h3><p class="desc" style="margin:0"></p></div>' : '') +
    '<div class="sec"><h3>相关节点</h3><div class="rel"></div></div>' +
    '<div class="hint">行号基准：主工作树 codex/skill-tool-system @ 13b5701。执行在 agent-run-* 子线程，IDE 需挂起全部线程。</div>';

  panel.querySelector('h2').textContent = n.t;
  panel.querySelector('.path .p').textContent = n.f + ':' + n.l;
  panel.querySelector('.desc').textContent = n.d;
  const ul = panel.querySelector('ul.bp');
  bp.forEach(item => {
    const li = document.createElement('li');
    const b = document.createElement('b'); b.textContent = ':' + item[0];
    const s = document.createElement('span'); s.textContent = item[1];
    li.appendChild(b); li.appendChild(s); ul.appendChild(li);
  });
  if(n.e) panel.querySelector('.trace').textContent = n.e;
  if(n.w && n.w.length){
    const w = panel.querySelector('ul.watch');
    n.w.forEach(v => { const li = document.createElement('li'); li.textContent = v; w.appendChild(li); });
  }
  if(n.d2) panel.querySelectorAll('p.desc')[1].textContent = n.d2;
  const rel = panel.querySelector('.rel');
  if(par){
    const b = document.createElement('button');
    b.innerHTML = '<i>↑</i><span></span>'; b.querySelector('span').textContent = '上级 · ' + par.t;
    b.addEventListener('click', () => { expandTo(par.id); render(); select(par.id); }); rel.appendChild(b);
  }
  kids.forEach(k => {
    const b = document.createElement('button');
    b.innerHTML = '<i>↓</i><span></span>'; b.querySelector('span').textContent = k.t;
    b.addEventListener('click', () => { expandTo(k.id); render(); select(k.id); }); rel.appendChild(b);
  });
  if(!par && !kids.length) rel.innerHTML = '<span style="color:var(--muted)">无</span>';

  panel.querySelector('#copy').addEventListener('click', () => {
    const text = n.f + ':' + n.l;
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
      const btn = panel.querySelector('#copy'); btn.textContent = '已复制';
      setTimeout(() => { btn.textContent = '复制'; }, 1200);
    });
  });
  panel.scrollTop = 0;
}

/* search */
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const term = q.value.trim().toLowerCase();
  const hits = new Set();
  if(!term){
    document.querySelectorAll('.node').forEach(el => el.classList.remove('hit','dim'));
    return;
  }
  byId.forEach(n => {
    const hay = (n.t + ' ' + n.s + ' ' + n.f + ' ' + (n.w || []).join(' ') + ' ' + (n.e || '')).toLowerCase();
    if(hay.includes(term)) hits.add(n.id);
  });
  hits.forEach(id => expandTo(id));
  if(hits.size) render();
  document.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('hit', hits.has(el.dataset.id));
    el.classList.toggle('dim', !hits.has(el.dataset.id));
  });
});

document.getElementById('expand').addEventListener('click', () => { collapsed.clear(); render(); });
document.getElementById('collapse').addEventListener('click', () => {
  TREE.c.forEach(k => collapsed.add(k.id));
  render();
});
document.getElementById('fit').addEventListener('click', fit);
function fit(){
  world.style.transform = 'scale(1)';
  const w = world.offsetWidth;
  const avail = canvas.clientWidth - 2;
  const s = Math.min(1, avail / w);
  world.style.transform = 'scale(' + s + ')';
  world.style.transformOrigin = '0 0';
}
window.addEventListener('resize', () => { if(canvas.clientWidth < world.offsetWidth) fit(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ selected = null; render(); } });

TREE.c.forEach(k => collapsed.add(k.id));
render();
select('root');
fit();
</script>
